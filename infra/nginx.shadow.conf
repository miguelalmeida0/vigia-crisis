server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; media-src 'self' blob:; worker-src 'self'; manifest-src 'self'" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # The remote-shadow surface has no remote authentication boundary for
  # long-lived streams. Disable public SSE here; the console uses bounded
  # HTTP refreshes, while local loopback releases retain SSE support.
  location ~ ^/api/v(?:1|2|9|10)/stream$ {
    return 404;
  }
  location ~ ^/backend/+api/v(?:1|2|9|10)/stream$ {
    return 404;
  }
  location /api/ { proxy_pass http://api:4177; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /backend/ { proxy_pass http://api:4177/; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /live { proxy_pass http://api:4177; }
  location /ready { proxy_pass http://api:4177; }
  location / { try_files $uri $uri/ /index.html; }
}
