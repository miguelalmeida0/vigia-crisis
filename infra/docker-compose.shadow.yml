services:
  postgis:
    image: postgis/postgis:17-3.5@sha256:0a23a2b5e4fbd9b4c6980d20ee80dd6b63dec52669379c75a506db58a4116708
    # The upstream PostGIS image is currently published for amd64; Apple Silicon uses Docker emulation.
    platform: linux/amd64
    environment:
      POSTGRES_DB: vigia
      POSTGRES_USER: vigia
      POSTGRES_PASSWORD: "${VIGIA_LOCAL_POSTGRES_PASSWORD:?set VIGIA_LOCAL_POSTGRES_PASSWORD}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigia -d vigia"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - vigia-postgis:/var/lib/postgresql/data

volumes:
  vigia-postgis:
